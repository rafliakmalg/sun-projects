# Satu pintu masuk. Hanya routing: prefix dibuang, tiap service tetap memeriksa token sendiri.
# resolver + variabel supaya gateway tetap hidup saat satu service dimatikan (nama DNS di-resolve per request).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    location = /up {
        default_type text/plain;
        return 200 "ok";
    }

    # login, logout, me hidup di bawah prefix auth/ di auth-ep; sisanya (users, roles, permissions) tanpa prefix
    location ~ ^/api/auth/(login|logout|me)$ {
        set $upstream http://auth-ep:80;
        proxy_pass $upstream/api/auth/$1$is_args$args;
    }

    location ~ ^/api/auth/(.*)$ {
        set $upstream http://auth-ep:80;
        proxy_pass $upstream/api/$1$is_args$args;
    }

    location ~ ^/api/wms/(.*)$ {
        set $upstream http://wms-ep:80;
        proxy_pass $upstream/api/$1$is_args$args;
    }

    location ~ ^/api/assistant/(.*)$ {
        set $upstream http://assistant-ep:80;
        proxy_pass $upstream/api/$1$is_args$args;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        set $upstream http://sun-web:80;
        proxy_pass $upstream;
    }
}
