# Run from sun-projects/: docker compose up --build
# Pintu masuk: gateway :8000 (/api/auth, /api/wms, /api/assistant, sisanya ke sun-web).
# Port langsung tiap service (untuk debug): auth-ep 8001, wms-ep 8002, assistant-ep 8006, sun-web 3000.
# *-ep containers get the same .test hostnames Herd uses, so assistant-ep's seeded
# site URL (http://wms-ep.test/api) resolves inside the network unchanged.
# Key JWT: keys/jwt-private.pem hanya untuk auth-ep, keys/jwt-public.pem untuk service lain (wms-ep, assistant-ep).
# docker/init.sql hanya jalan saat volume DB baru; setelah menambah DB: docker compose down -v
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wms_ep
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20

  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [auth-ep, wms-ep, assistant-ep, sun-web]
    ports: ["8000:80"]

  auth-ep:
    build: ./auth-ep
    env_file: ./auth-ep/.env
    environment:
      <<: &db
        DB_HOST: db
        DB_PORT: 3306
        DB_USERNAME: root
        DB_PASSWORD: ""
        PHP_CLI_SERVER_WORKERS: 4
      JWT_PRIVATE_KEY_PATH: /keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
    volumes:
      - ./keys:/keys:ro
    command: >
      sh -c "php artisan migrate --force
      && php artisan db:seed --force
      && php artisan serve --host=0.0.0.0 --port=80 --no-reload"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 5s
      retries: 20
    depends_on:
      db: { condition: service_healthy }
    networks:
      default:
        aliases: [auth-ep.test]
    ports: ["8001:80"]

  wms-ep:
    build: ./wms-ep
    env_file: ./wms-ep/.env
    environment:
      <<: *db
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
    volumes:
      - ./keys/jwt-public.pem:/keys/jwt-public.pem:ro
    command: >
      sh -c "php artisan migrate --force
      && php artisan db:seed --force
      && php artisan serve --host=0.0.0.0 --port=80 --no-reload"
    depends_on:
      db: { condition: service_healthy }
    networks:
      default:
        aliases: [wms-ep.test]
    ports: ["8002:80"]

  assistant-ep:
    build: ./assistant-ep
    env_file: ./assistant-ep/.env
    environment:
      <<: *db
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
    volumes:
      - ./keys/jwt-public.pem:/keys/jwt-public.pem:ro
    command: >
      sh -c "php artisan migrate --force
      && php artisan db:seed --force
      && php artisan serve --host=0.0.0.0 --port=80 --no-reload"
    depends_on:
      db: { condition: service_healthy }
    networks:
      default:
        aliases: [assistant-ep.test]
    ports: ["8006:80"]

  sun-web:
    build:
      context: ./sun-web
      args:   # baked at build time; relatif karena frontend dan API satu host (gateway)
        VITE_API_URL: /api
        VITE_ASSISTANT_SITE: wms
        VITE_ASSISTANT_URL: /api/assistant
    ports: ["3000:80"]

volumes:
  dbdata:
